name: CI

# Deterministic pull-request gates only. The credential-gated live Meta protocol smoke
# (`pnpm test:meta-smoke`) is never run here, and no secret is referenced.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Without a `version` input, the action installs the `packageManager` pnpm version.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Show toolchain versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Part of the integration suite and the whole end-to-end suite open the pinned headed
      # Chromium, so both run under a virtual X display.
      - name: Test
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm test

      - name: End-to-end tests
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm test:e2e
